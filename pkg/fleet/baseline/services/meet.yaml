name: meet
kind: service
description: meet rooms and the DM front door
exec: [bashy, meet, serve, --port, "{port}", --bind, "{bind}"]
ports:
  - name: http
    port: 8637
health:
  http: /healthz
  interval: 10s
  timeout: 2s
  failures: 3
restart:
  policy: on-failure
  backoff: {min: 1s, max: 30s, healthy_after: 30s}
  start_limit: {burst: 5, interval: 5m}
expose:
  app: {name: meet, require_login: true, trust_cloud_identity: true}
enabled: true
