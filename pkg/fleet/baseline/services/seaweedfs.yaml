name: seaweedfs
kind: service
description: SeaweedFS — distributed object store and S3 gateway
exec: [bashy, seaweedfs, serve, --port, "{port}", --addr, "{bind}", "--data={settings.data_dir}", --version, "{settings.version}"]
settings:
  data_dir: ""
  version: "bashy-4.48-1"
ports:
  - name: http
    port: 8333
health:
  http: /
  interval: 10s
  timeout: 3s
  failures: 3
  start_period: 45s
restart:
  policy: on-failure
  backoff: {min: 1s, max: 30s, healthy_after: 30s}
  start_limit: {burst: 5, interval: 5m}
expose:
  mesh:
    - name: s3
upgrade: restart
enabled: false
