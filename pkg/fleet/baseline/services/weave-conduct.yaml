name: weave-conduct
kind: service
description: Poll the joined task feed and execute host-side gateway directives
exec: [bashy, weave, conduct, --repo, "{settings.repo}"]
settings:
  repo: ""
restart:
  policy: on-failure
  backoff: {min: 5s, max: 5m, healthy_after: 5m}
  start_limit: {burst: 5, interval: 30m}
enabled: false
