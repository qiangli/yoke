name: muse
kind: cli
display: Muse Code
aliases:
  - muse-code
cli:
  # `muse` is a bash launcher (~/.local/bin/muse) that self-updates and execs
  # the versioned muse-bin-<ver> beside it. Installed by
  # `curl -fsSL https://dev.meta.ai/install.sh | sh`.
  binary: muse
  # MANAGED INSTALL (D12, 2026-10-09): Meta's own versioned muse binary — the
  # artifact the vendor's bash launcher (~/.local/bin/muse) downloads as
  # muse-bin-<ver> — pinned and verified against the vendor's manifest.json
  # (checksum_algorithm sha256; aarch64_macos was downloaded and re-hashed on a
  # trusted dev host on 2026-10-09 and matched). Raw executables. The managed
  # binary is the versioned muse-bin, NOT the self-updating launcher, so there
  # is no auto-update to switch off. Proprietary: Meta's Muse Code terms.
  managed:
    source: vendor-url
    version: 1.4.4-R5419.1
    license: Meta Muse Code Terms of Service (proprietary)
    license_url: https://dev.meta.ai/
    assets:
      darwin/arm64:
        url: https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={version}&file=muse-aarch64-macos
        sha256: 7f708414207d1665858baa6ef2ef0f5c69c727f5b3c00243fa398c2f5d5b5cc0
      darwin/amd64:
        url: https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={version}&file=muse-x86-macos
        sha256: d88fc9da14cff06a5f40e209e8c3502451329d8d5143c147bb7b7609204d1aa2
      linux/amd64:
        url: https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={version}&file=muse-x86-linux
        sha256: cfc9d068441ff46036ad6bbf30dd794043b25b7efb69648c92c022ccf65f7d19
      linux/arm64:
        url: https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={version}&file=muse-aarch64-linux
        sha256: bc1196793927baaf07535e9199d053ea3754b3bc658da1fec13d37f089cccd11
      windows/amd64:
        url: https://lookaside.facebook.com/lookaside/muse/download/?channel=muse&version={version}&file=muse-x86-windows.exe
        sha256: 5caacb02eea2734405786e50cb42aeea3eeb46b4fa9801cfa666cda225101749
  launch:
    # RUNG 2 via stdout. Measured against Muse Code 1.3.0 on 2026-09-23: one
    # MSP record per line, kind under the top-level `payload_type`. A success
    # (offline echo provider) ends on run.terminal.completed; a real failure
    # (a 402 billing_error from the meta provider, exit 1) ends on
    # run.terminal.failed with payload.terminal = "failed". The binary also
    # spells run.terminal.cancelled.
    events_stdout: --json
    events_outcome:
      path: payload.terminal
      ok: [completed]
    events_done:
      field: payload_type
      values: [run.terminal.completed, run.terminal.failed, run.terminal.cancelled]
    # --yolo = no approval, no sandbox, trust this workspace (this run only).
    # Without it headless exec stops at approval prompts (default on-request).
    exec: muse exec --yolo --model {model} {prompt}
    # No workspace_arg: the launcher inserts it right after the binary, where
    # `muse --workspace W exec ...` parses as TUI options and rejects exec's
    # flags (measured under weave 2026-09-23). muse roots its workspace at the
    # cwd, and weave already runs the agent inside the allocated workspace.
    prompt_position: last
    # Bare `muse --model X` opens Muse's own interactive TUI. It quits unless its
    # terminal startup queries (OSC 10/11/4, CSI ? u, CSI c, CSI 6n) are answered;
    # agentpty's headless branch answers them (termquery.go). supports_say is
    # MEASURED: TestSteerLive STEER_TOOL=muse passed 2026-09-23 (STEERED_OK echoed
    # and answered) with the standard text, pause, CR submit.
    steer_exec: muse --yolo --model {model}
    supports_say: true
    # A mid-turn steer needs a SECOND Enter: the TUI drops an Enter that arrives
    # while it is busy, leaving the line unsent. agentpty sends one 3 s later for
    # every tool (steerResubmitDelay). No steer_interrupt (ESC) is needed —
    # measured 2026-09-28, agent-bench l4/t3-stop: one Enter 0/3; a second Enter
    # 3 s later, no ESC, 2.
    supports_graceful_quit: true
    notes: >-
      Meta's terminal coding agent (Muse Code). Headless is the `exec`
      subcommand; --reasoning-effort (none..ultra, default high) is a separate
      axis not templated here. Live-verified 2026-09-23: exec --json --yolo
      --workspace wrote, ran and committed a file in 15 s, ending on
      run.terminal.completed.
    auth_hint: >-
      Muse Code needs a Meta sign-in (`muse login`, or `muse auth set
      --api-key-stdin`) AND a Muse Code subscription or billing on dev.meta.ai;
      without one every call fails 402 billing_error.
    watchdog:
      max_runtime: 45m
      mem_limit: 12g
quirks: drops an Enter that arrives mid-turn, leaving a steer unsent in the input box; a second Enter (agentpty steerResubmitDelay) submits it (agent-bench l4/t3-stop 0/3 with one Enter, 2 with two, 2026-09-28)
harness:
  operability: 0.75
  shell: 0.75
  tool-use: 0.75
  isolation: 0.7
# Where this tool reads skills, instructions and MCP servers (dhnt research
# agentic-cli-integration-surfaces-2026-10): bashy skill export --tool reads it.
integration:
  detect: ${XDG_CONFIG_HOME:-~/.config}/muse
  skills:
    user: ["${XDG_CONFIG_HOME:-~/.config}/muse/skills"]
  instructions:
    - {file: AGENTS.md, scope: project}
  mcp: {config: "${XDG_CONFIG_HOME:-~/.config}/muse/settings.json", format: json, key: mcpServers}
