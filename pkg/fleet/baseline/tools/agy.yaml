name: agy
kind: cli
display: Antigravity
aliases:
  - antigravity
cli:
  binary: agy
  # Google's install.sh selects a per-platform updater manifest. Each URL
  # below comes from that manifest, and each SHA-512 was computed from the
  # downloaded asset and matched to the manifest. Unix archives contain
  # `antigravity`, which binmgr caches as `agy`. Windows ships a raw executable.
  managed:
    source: vendor-url
    version: 1.5.13
    license: Google Terms of Service (proprietary)
    license_url: https://policies.google.com/terms
    # NO THIRD-PARTY TRACKING (Sprint #434 rule 2, docs/bashy-supply-chain-audit.md):
    # The 1.3.2 audit found only the auto-update switch:
    #   - no DO_NOT_TRACK read (zero occurrences);
    #   - the complete AGY_*/ANTIGRAVITY_*/JETSKI_* env surface carries no
    #     telemetry, analytics or crash-report switch (the AGY_CLI_DISABLE_*
    #     family is rendering: LATEX, MERMAID, ESCAPE_SEQUENCE_OPTIMIZATIONS);
    #   - `--disable_telemetry` is NOT a flag of 1.3.2: the string belongs
    #     to an embedded component, and `agy --disable_telemetry …` answers
    #     "flags provided but not defined: -disable_telemetry";
    #   - the binary DOES link Clearcut and Sentry, but the telemetry knobs
    #     (disable_telemetry, ANTIGRAVITY_SENTRY_SAMPLE_RATE, …) are
    #     SERVER-SIDE proto/experiment fields, so they are the account's
    #     setting to flip, not ours — guessing one here would read like a
    #     protection that is not there.
    # Nothing is invented: if a switch appears in a later pin, it goes here.
    env:
      - AGY_CLI_DISABLE_AUTO_UPDATE=1
    assets:
      darwin/arm64:
        url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/darwin-arm/cli_mac_arm64.tar.gz
        sha512: d9825ebce6954df6b7841970fd7ef3d37acdfe628993f14c396ec73b20ed06bbe95e7b7be047e7c0b0baaf009f75fe95ce051b9f4af5e84b002da15bda4a1f45
        member: antigravity
      darwin/amd64:
        url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/darwin-x64/cli_mac_x64.tar.gz
        sha512: 6a7087eb847029bead89d496a6c4a5d3ec8552f351a486b3917948fee2a9a72ec6e2be7eae866b975b8ed3fc2a1827cf176b5bd45d6eb9970424fec4352d3930
        member: antigravity
      linux/amd64:
        url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/linux-x64/cli_linux_x64.tar.gz
        sha512: 014b37387703acab1f47cd532c8bb60167a6a3537b0f9891de03f1b1ffa9614307bc83c4b2f7551273b0877d722716b0cd9e26782f6b2a50705db4f05e18c68f
        member: antigravity
      linux/arm64:
        url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/linux-arm/cli_linux_arm64.tar.gz
        sha512: dccea2eb455099f5175f0c87cc47b38fcefe4cb0cb44dea3927469bb4bbf68ac3c0b30fc04affb24c17e90959386a93c3785e8e4b8b1a3338ca4e4d57b80057b
        member: antigravity
      windows/amd64:
        url: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.13-5999302598852608/windows-x64/cli_windows_x64.exe
        sha512: 6b80a17a2bc34a969ed9ba31500a8201b0b4aad3e7fe061374022d161fec8bd7de49b6dc069a6ac67a90632e8671bbe860a7e94309bc5adbc536d27a75a86b58
  launch:
    gateway_args:
      - {action: before-prompt, args: [--new-project, --add-dir, '{cwd}', --log-file, '{dev_null}']}
      - {action: remove, args: ['-p'], when: stream}
      - {action: remove-pair, args: [--print-timeout], when: stream}
      - {action: append, args: [--input-format, stream-json], when: stream}
      - {action: append-missing, args: ['{events}'], when: stream}
      - {action: append, args: ['-p='], when: stream}
      - {action: before-prompt, args: ['{events}'], when: cold}
    decoder: {kind: agy-steps, text_path: step_update.text_delta, final_path: result.response}
    stdin_format: agy-steps
    warm: stdin-stream-json
    # RUNG 2 via stdout. Measured on the wire 2026-07-31:
    #
    #   $ agy -p "say ok" --output-format stream-json
    #   {"event":"step_update","step_update":{...,"state":"ACTIVE",...}}
    #   {"event":"step_update","step_update":{...,"state":"DONE",...}}
    #   {"event":"result","result":{"status":"SUCCESS","num_turns":1,...}}
    #
    # Re-measured 2026-09-29 (Sprint #328 / #1230): assistant text is
    # step_update.step_type=agent_response, with text_delta on ACTIVE and
    # DONE updates. result.response repeats the complete answer; result.usage
    # includes cache_read_tokens. cligw extracts deltas, or falls back to the
    # terminal response when no deltas arrived, and starts a fresh project.
    # NOTE THE KEY: agy nests its kind under `event`, where every other tool
    # uses `type`. A matcher assuming `type` would never fire here, and would do
    # so silently — a boundary that never arrives is indistinguishable from a
    # tool still thinking. That asymmetry is why events_done declares its field.
    events_stdout: --output-format stream-json
    # Nested one level deeper than claude's, which is why the path is declared
    # rather than assumed. Measured on a success; the failing status has not
    # been seen, so it is not guessed at.
    events_outcome:
      path: result.status
      ok: [SUCCESS]
    events_done:
      field: event
      values: [result]
    # LIMIT (agy --help, 2026-09-26): print mode has no system-prompt or base-
    # instructions override. cligw therefore sends its neutral prompt and any
    # request system/developer messages in an explicit inline System block.
    # DO NOT ADD `--effort {effort}` HERE. agy has an `--effort (low|medium|high)`
    # flag, but it is a SECOND SPELLING of the model id's suffix rather than a
    # second axis, and agy rejects disagreement — measured 2026-08-02:
    #
    #   $ agy --model gemini-3.5-flash-low --effort high
    #   Error: invalid model selection: --model gemini-3.5-flash-low conflicts
    #          with --effort=high                                    (exit 1)
    #
    # Every binding already carries its effort in the id (gemini-3.6-flash-high,
    # gemini-3.1-pro-low, …), so adding the flag would kill the whole agy fleet
    # at once. To change effort, bind a different model id.
    exec: agy --dangerously-skip-permissions --print-timeout 40m --model {model} -p {prompt}
    unsafe: {canonical: --dangerously-skip-permissions}
    # AGY otherwise may retain/select a different project despite the process
    # cwd. Bind the allocated clone explicitly, before model/prompt argv.
    # --add-dir makes the allocated clone visible, but does not select it:
    # agy can otherwise resume its remembered Antigravity project (often the
    # user's scratch checkout). --new-project is deliberately paired with it
    # so every governed worker starts a fresh project rooted at this workspace.
    workspace_arg: --new-project --add-dir {workspace}
    # Plan mode is the read-only, fail-closed check run before the worker prompt.
    # The generic launcher supplies a prompt requiring exactly PWD=<path> and
    # weave compares that reported path to the allocated clone.
    workspace_preflight_exec: agy --mode plan --print-timeout 40m --model {model} -p {prompt}
    # Bare `agy --model X` (no -i, no -p) opens agy's OWN interactive TUI — that is
    # the native steerable session, so the operator sees agy's real UI (not a bashy
    # wrapper) and the first message arrives over the control channel (supports_say).
    # `-i <prompt>` REQUIRES an initial-prompt argument and is only for a one-shot
    # seed; using it here dangled the flag when a human opened an empty session.
    steer_exec: agy --dangerously-skip-permissions --model {model}
    prompt_position: last
    trust_preseed: .gemini/antigravity-cli/settings.json
    # On macOS, agy 1.5 can reuse the user's browser sign-in from the
    # keychain even with an isolated HOME. Probe from the worker environment:
    # `agy models` prints tab-separated ID and name rows when signed in.
    auth:
      check_exec: models
      ok_match: ['(?m)^[A-Za-z0-9][\w.+~-]*\t+\S']
    # UNVERIFIED name (same as the booth's derived fallback); E1 live check.
    config_dir_env: AGY_CONFIG_DIR

    # supports_say: MEASURED, not asserted. Proven with agentpty.Run + BrokerSay —
    # the production path `meet say` uses — in pkg/agentpty/steer_live_test.go.
    # It was `false` here for months because nobody ever tried, and because the
    # control channel sent `text + \r` in ONE write, which a TUI in bracketed-paste
    # mode reads as a PASTE: the steer landed in the input box and was never
    # submitted. Two writes (text, pause, Enter) and it submits.
    supports_say: true
    supports_graceful_quit: true
    notes: headless `-p`; --add-dir binds weave's allocated workspace; plan-mode PWD preflight runs before the writer; bare `agy --model X` opens the steerable TUI (`-i` is a one-shot seed only). Bump --print-timeout (default 5m).
    auth_hint: >-
      If the worker is signed out, run `agy` interactively in its environment and
      complete browser sign-in. On macOS, headless runs need access to the user's keychain.
    watchdog:
      max_runtime: 45m
      mem_limit: 12g
quirks: surgical; forgets to commit (salvage); the prompt must be the last arg (-p swallows flags)
harness:
  operability: 0.85
  shell: 0.85
  tool-use: 0.8
  isolation: 0.75
# Tool commands (Sprint #324): agy's own vendor features as bashy services,
# `bashy tool cmd run agy:<name> -- TEXT`. Only commands MEASURED on the wire
# are seeded here; the rest are a user overlay
# (docs/tool-commands-overlay-example.yaml in the umbrella).
commands:
  # MEASURED 2026-11-12 (agy 1.5.7, Sprint #626 S3): print mode with
  # --mode accept-edits read invoice.pdf and wrote a UTF-8 text summary;
  # JSON status SUCCESS. No permission-bypass flag was used.
  # Elapsed (conductor re-measure, agy 1.5.7): 83 s; summary carried invoice 1047 and USD 480.00.
  - name: pdf
    slash: Read the PDF named in this request and write a plain UTF-8 summary to one TXT file in the current working directory. Report its path. {args}
    mode: print
    capability: pdf-reading
    effects: [read, write]
    output: 'file:*.txt'
    exec: agy --mode accept-edits --output-format text -p {prompt}
  # MEASURED 2026-11-12 (agy 1.5.7, Sprint #626 S1): plan is the print-mode
  # session flag `--mode plan` (agy --help: accept-edits, auto, plan), hence
  # exec:. `agy --mode plan --output-format json -p TEXT` on a toy git repo
  # (add a --shout flag to a 3-line hello.sh) returned status SUCCESS, a
  # four-step plan in 39.5 s (agy also wrote implementation_plan.md under its
  # own brain dir) and an unchanged work tree. -p takes the NEXT token as the
  # prompt — `-p --output-format …` exits 2 — so -p sits right before {args},
  # the request as ONE operand. Text output: toolcmd reads a JSON terminal
  # `result` string, and agy's JSON carries the plan under result.response.
  # slash: is the command's identity; it is not sent.
  - name: plan
    slash: /plan {args}
    mode: print
    capability: planning
    output: turn
    exec: agy --mode plan --output-format text --model {model} -p {args}
  # MEASURED 2026-11-12 (agy 1.5.7, Sprint #626 S6): agy -p understands video
  # files directly via prompt, extracting visual description, duration, resolution,
  # audio transcripts and content summaries. Measured on
  # examples/transcribe/fixtures/speech-video.webm (11s, 32x32 vp9/opus) without
  # --dangerously-skip-permissions: returned full visual analysis and verbatim
  # Wikispeech transcript in 25 s.
  - name: video
    slash: /video {args}
    mode: print
    capability: video
    output: turn
    exec: agy --output-format text --model {model} -p {args}
  # MEASURED 2026-11-12 (agy 1.5.7, Sprint #626 S5b): exploration of native
  # Google access (Gmail/Drive) measured on the wire (read-only, no bypass flags).
  # Unlike claude (which seeds claude:email.read and claude:drive.read using
  # claude.ai connectors with --allowedTools/--disallowedTools restricting execution),
  # agy has no native headless Gmail or Drive connector in its CLI, no
  # tool-allowlist flags, and no read-only Workspace execution mode:
  # 1. Plan mode (`agy --mode plan --output-format text -p "Search Gmail for messages newer_than:7d (max 5) and output count or IDs only."`):
  #    exit 0, 39.5 s; outputs an implementation plan requesting approval and
  #    does not query Gmail.
  # 2. Native tools query (`agy --output-format text -p "Without using run_command, terminal, or any shell commands: do you have any native tool or capability to access Gmail or Google Drive?"`):
  #    exit 0, 2.5 s; confirms: "No, I do not have any native tool or built-in capability
  #    to access Gmail or Google Drive in this session... native tools are limited to:
  #    Local filesystem operations, Public web access, Agent & task management, Shell execution."
  # 3. Direct print mode (`agy --output-format text -p "Search Gmail for messages newer_than:7d (max 5) and output count or IDs only."`):
  #    exit 0, 73.6 s; reaches Gmail only by shelling out to `bashy google gmail-list`
  #    via run_command.
  # 4. Direct Drive list (`agy --output-format text -p "List my 5 most recently modified Drive files and output count or IDs only."`):
  #    exit 0, 187.9 s; delegates to `bashy google drive-list`, which fails with
  #    403 insufficientPermissions (OAuth grant lacks Drive scope).
  # Per operator rule ("If agy cannot reach Gmail/Drive headlessly, record command,
  # exit and output instead of seeding"), agy:email.read and agy:drive.read are not
  # seeded in the baseline. If desired, shell-delegated variants belong in the user overlay.
# Where this tool reads skills, instructions and MCP servers (dhnt research
# agentic-cli-integration-surfaces-2026-10): bashy skill export --tool reads it.
integration:
  detect: ~/.gemini
  skills:
    user: [~/.gemini/config/skills]
  instructions:
    - {file: ~/.gemini/GEMINI.md}
    - {file: AGENTS.md, scope: project}
  mcp: {config: ~/.gemini/config/mcp_config.json, format: json, key: mcpServers}
