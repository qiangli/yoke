name: codex
kind: cli
display: Codex
cli:
  binary: codex
  # MANAGED INSTALL (D12, 2026-10-09): OpenAI's own `codex-package-<triple>`
  # release archive (bin/codex + codex-path/rg + resources; the same tree the
  # vendor's dotslash `codex` launcher unpacks), pinned and verified against
  # the vendor's codex-package_SHA256SUMS. Unpacked whole (tree) because codex
  # resolves its bundled rg and resources beside bin/codex. Linux uses the
  # static musl build. darwin/arm64 and windows/amd64 archives were downloaded
  # and re-hashed on a trusted dev host on 2026-10-09 and matched the sums.
  # Self-update: codex has no env switch; its startup update CHECK is the
  # config key check_for_update_on_startup (a notice, never a self-replace),
  # and a cache-path binary is never rewritten by npm/brew.
  # cli.versions / cli.linux below are the SEALED-IMAGE recipe (npm), untouched.
  managed:
    source: github-release
    version: 0.162.0
    license: Apache-2.0
    license_url: https://github.com/openai/codex/blob/main/LICENSE
    assets:
      darwin/arm64:
        url: https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-aarch64-apple-darwin.tar.gz
        sha256: 5809ee90a9c3b59d438bb2663aefa0b43d86f825438b65d4504b31f82343628b
        tree: true
        entrypoint: bin/codex
      darwin/amd64:
        url: https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-x86_64-apple-darwin.tar.gz
        sha256: 928b421103f339683d0d9f8a648f7b591ae4be907cbd8a5418dda319ff2bbd3c
        tree: true
        entrypoint: bin/codex
      linux/amd64:
        url: https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-x86_64-unknown-linux-musl.tar.gz
        sha256: 4f573944c1d2059109d75a2f4d0cc9c03697288224a5e407717a9de98fc010c5
        tree: true
        entrypoint: bin/codex
      linux/arm64:
        url: https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-aarch64-unknown-linux-musl.tar.gz
        sha256: d47a5fa21e037a1b85729b88c238ff3da8a956fc9fb5ad3976714428e7fb2bda
        tree: true
        entrypoint: bin/codex
      windows/amd64:
        url: https://github.com/openai/codex/releases/download/rust-v{version}/codex-package-x86_64-pc-windows-msvc.tar.gz
        sha256: 10450400524611cc28ffe1a0f1fb80c48e675c485a080cfb949592a719f04e42
        tree: true
        entrypoint: bin/codex.exe
  versions:
    - version: 0.157.1
  linux:
    install: npm install -g @openai/codex@{version}
    requires: [nodejs, npm]
    binary: codex
  launch:
    warm: stdin
    session_env:
      - CODEX_SESSION_ID
      - CODEX_THREAD_ID
    # RUNG 2 via stdout. Measured on the wire 2026-07-31:
    #
    #   $ codex exec --json "say ok"
    #   {"type":"thread.started","thread_id":"..."}
    #   {"type":"turn.started"}
    #   {"type":"item.completed","item":{...}}
    #   {"type":"turn.completed","usage":{...}}
    #
    # Two launcher notes measured at the same time: codex REFUSES outside a git
    # repo without --skip-git-repo-check, and reads stdin unless it is closed.
    events_stdout: --json
    # NO events_outcome, deliberately. turn.completed carries usage and nothing
    # that reads as a verdict, and no failing terminal event has been observed —
    # so there is nothing to declare. A tool with no path yields `unverified`,
    # which is the honest answer and still sends the caller to the gate.
    events_done:
      field: type
      values: [turn.completed]
    # The shared launcher replaces workspace-write with Codex's approval and
    # sandbox bypass by default (operator decision, 2026-09-30). The template's
    # sandbox remains available for an explicit safe sandbox override.
    exec: codex exec --skip-git-repo-check --sandbox workspace-write --model {model} {prompt}
    # These grants apply when an orchestrator allocates a workspace and the
    # caller explicitly selects workspace-write. With the default bypass they
    # have no effect. They were measured on codex-cli 0.157.1: without them,
    # workspace-write denied writes to <root>/.git and loopback socket binds.
    # -c is a global option, so it must precede `exec` (rendered after the binary).
    # {gocache} is the run's weave-managed GOCACHE: outside the workspace, so
    # without this grant go build/test is denied and the worker invents a /tmp
    # cache that nothing reclaims (todo 7e5009b7d531).
    workspace_arg: -c sandbox_workspace_write.writable_roots=["{workspace}/.git","{gocache}"] -c sandbox_workspace_write.network_access=true
    steer_exec: codex --no-daemon --model {model}
    prompt_position: last
    # MEASURED 2026-09-24 (codex-cli 0.156.1): a directory codex has not seen
    # opens a "Trust this folder? … 1. Trust and continue  2. Quit" dialog, and
    # the answer is saved in ~/.codex/config.toml as
    # [projects."<git top-level>"] trust_level = "trusted". The preseed writes
    # that table first. No trust_clear: the generic PTY trust tap clears the
    # dialog with "1" if it appears anyway, and trust_clear would also mark codex
    # NeedsTerminal, changing how its headless exec launches.
    trust_preseed: codex.toml

    # supports_say: MEASURED, not asserted. Proven with agentpty.Run + BrokerSay —
    # the production path `meet say` uses — in pkg/agentpty/steer_live_test.go.
    # It was `false` here for months because nobody ever tried, and because the
    # control channel sent `text + \r` in ONE write, which a TUI in bracketed-paste
    # mode reads as a PASTE: the steer landed in the input box and was never
    # submitted. Two writes (text, pause, Enter) and it submits.
    supports_say: true
    supports_graceful_quit: true
    notes: >-
      headless `exec`; Bashy's launch resolver defaults to Codex's full-access
      bypass. Explicit safe sandbox overrides use `-s/--sandbox` (codex 0.141.0 —
      NOT `--workspace`, which errors 'unexpected argument' and exits 2). --full-auto
      is deprecated. Not steerable.
    watchdog:
      max_runtime: 45m
      mem_limit: 12g
quirks: reliable + honest no-ops; clean headless exec; can be plausibly-wrong — gate it
harness:
  operability: 0.7
  shell: 0.65
  tool-use: 0.85
  isolation: 0.8
# Tool commands (Sprint #324): codex's own vendor features as bashy services,
# `bashy tool cmd run codex:<name> -- ARGS`. Only commands MEASURED on the
# wire are seeded here; the rest are a user overlay
# (docs/tool-commands-overlay-example.yaml in the umbrella).
commands:
  # MEASURED 2026-09-28 (codex-cli 0.157.1, Sprint #324 S2 live smoke): review
  # is a print-mode SUBCOMMAND, not a slash line (`codex exec review --help`:
  # [PROMPT], --uncommitted, --base, --commit, --json, -m), hence exec:.
  # `codex exec review --json --uncommitted` on a 3-line toy git repo returned
  # outcome success in 24.4 s with a P1 finding. {args} is the caller's argv
  # verbatim (e.g. `-- --uncommitted` or `-- --base main "focus on auth"`).
  # Like every codex exec it wants a git repo (run with --dir inside one), and
  # like the tool's own exec: line it passes --skip-git-repo-check: the door
  # runs it in an X-Bashy-Workdir codex has never trusted, where it otherwise
  # exits 1 "Not inside a trusted directory" (measured 2026-09-29, S5 smoke).
  # slash: is the TUI spelling and the command's identity; it is not sent here.
  - name: review
    slash: /review {args}
    mode: print
    capability: code-review
    output: turn
    exec: codex exec review --json --skip-git-repo-check {args}
