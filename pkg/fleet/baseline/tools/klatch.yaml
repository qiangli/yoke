# Klatch server — signed release of the Apache-2.0 Databag fork.
# The archive contains the server and transform scripts. binmgr extracts the
# executable member; an optional service points -t at the separately unpacked
# scripts. Each asset has a matching .sigstore.json bundle beside it.
