name: claude
kind: cli
display: Claude Code
cli:
  binary: claude
  # MANAGED INSTALL (D12, 2026-10-09): Anthropic's native Claude Code release
  # binary from the same GCS bucket `claude install` uses, pinned and verified
  # against the vendor's <version>/manifest.json sha256 (darwin/arm64 was
  # downloaded and re-hashed on a trusted dev host on 2026-10-09 and matched).
  # Raw executables, no archive. Linux uses the glibc build (the bucket also
  # has -musl variants). The npm package @anthropic-ai/claude-code@2.1.295 is
  # the same release; its licence field reads "SEE LICENSE IN README.md" —
  # the Anthropic Commercial Terms of Service, a proprietary binary: download
  # and run under those terms, never vendored. DISABLE_AUTOUPDATER keeps the
  # pin from replacing itself.
  managed:
    source: vendor-url
    version: 2.1.295
    license: Anthropic Commercial Terms of Service (proprietary; SEE LICENSE IN README.md)
    license_url: https://www.anthropic.com/legal/commercial-terms
    # NO THIRD-PARTY TRACKING (Sprint #434 rule 2, docs/bashy-supply-chain-audit.md).
    # Every switch below was read out of the PINNED 2.1.295 binary itself
    # (`strings claude | grep`), not from a doc that may describe another
    # release: each name appears as a live `process.env.<NAME>` read, and
    # DISABLE_NON_ESSENTIAL_MODEL_CALLS — which the docs still list — is GONE
    # from this build, so it is deliberately not set (a dead key reads like a
    # protection that is not there).
    #
    #   CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC  essential-traffic-only mode
    #     (`Rt()` = privacy level "essential-traffic"): no startup connection
    #     warm-up, no plugin-archive download, no built-in gh api, no live
    #     preview, no guest vitals emitter. Anthropic's OWN sandbox-guest env
    #     sets it alongside DISABLE_AUTOUPDATER=1, so it is a vendor-supported
    #     configuration rather than an undocumented corner.
    #   DISABLE_TELEMETRY / DO_NOT_TRACK  the two spellings this build accepts
    #     for "no product telemetry"; both also switch OFF third-party
    #     feature-flag evaluation (`telemetryDisabledBy`). Remote Control and
    #     taking a remotely-started session need flags and therefore stop
    #     working — neither is reachable from a governed headless worker.
    #   DISABLE_ERROR_REPORTING  no crash/exception upload.
    #   DISABLE_GROWTHBOOK  names the third-party flag vendor explicitly
    #     (`ug()` = !DISABLE_GROWTHBOOK && …), so rule (2) does not rest on
    #     DISABLE_TELEMETRY happening to imply it.
    #   DISABLE_BUG_COMMAND / DISABLE_FEEDBACK_COMMAND  /bug and /feedback
    #     refuse with "disabled via the … environment variable" instead of
    #     uploading a transcript.
    #   CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY  no in-session product survey.
    #
    # OTel export stays UNSET: CLAUDE_CODE_ENABLE_TELEMETRY is the opt-in, and
    # if it is ever turned on OTEL_EXPORTER_OTLP_ENDPOINT may only name bashy's
    # local collector, never a vendor endpoint.
    env:
      - DISABLE_AUTOUPDATER=1
      - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
      - DISABLE_TELEMETRY=1
      - DO_NOT_TRACK=1
      - DISABLE_ERROR_REPORTING=1
      - DISABLE_GROWTHBOOK=1
      - DISABLE_BUG_COMMAND=1
      - DISABLE_FEEDBACK_COMMAND=1
      - CLAUDE_CODE_DISABLE_FEEDBACK_SURVEY=1
    assets:
      darwin/arm64:
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/darwin-arm64/claude
        sha256: 0116ee2e0a513900b633d9951367f18747686478e2b462805b8c31609f047f70
      darwin/amd64:
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/darwin-x64/claude
        sha256: a6066492288585a1ef5e482cb28ad22714ab12cd48e367c0cee988b00cff724c
      linux/amd64:
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/linux-x64/claude
        sha256: 4503bfe11a6c7fcc1e0b39b5e0d347c04248f750b03b0977b3ad6b531fe6f358
      linux/arm64:
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/linux-arm64/claude
        sha256: cfb9dc1332fb6f92a683f835823e91b3179a803398ca7852cd2381a3cb1dea3b
      windows/amd64:
        url: https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{version}/win32-x64/claude.exe
        sha256: a30012741c3d0b55e2a6c252dab3781134b75be95896ae89d40a93e10f83bcd6
  launch:
    native_system_prompt: true
    effort_args: [--effort, '{effort}']
    gateway_args:
      - {action: move-first, args: ['-p'], when: stream}
      - {action: before-prompt, args: ['{events}', --include-partial-messages, --system-prompt, '{system}', --tools, '', --no-session-persistence, --strict-mcp-config, --setting-sources, '', '{effort_args}'], when: cold}
      - {action: append, args: [--input-format, stream-json, '{events}', --include-partial-messages, --system-prompt, '{system}', --tools, '', --no-session-persistence, --strict-mcp-config, --setting-sources, '', '{effort_args}'], when: stream}
    decoder: {kind: claude-stream-json, text_path: event.delta.text, final_path: result}
    stdin_format: claude-stream-json
    warm: stdin-stream-json
    # OPT-IN PROVIDER ROUTE (S584 B1): a model with api_key_ref aws-bedrock
    # (models/bedrock-*.yaml) projects its bearer key under the name Claude
    # Code reads for Bedrock. The native subscription launch declares no ref
    # and is untouched by this line.
    credential_env:
      aws-bedrock: AWS_BEARER_TOKEN_BEDROCK
    # -p is print mode, and it must be EXPLICIT. Without it claude infers
    # headlessness from "stdout is not a terminal" — which holds on a pipe and
    # is false the moment the agent is given a PTY (to clear its trust prompt,
    # or to be steered mid-run). It then opens its REPL and waits forever, and
    # the captured "answer" is a TUI banner. Every other tool in the fleet
    # already says so out loud (codex `exec`, opencode `run`, aider --message,
    # agy -p); claude was the only one relying on the guess.
    # RUNG 2 via stdout. Measured on the wire 2026-07-31, not read off the help:
    #
    #   $ claude -p "say ok" --output-format stream-json --verbose
    #   {"type":"system","subtype":"init",...}
    #   {"type":"assistant","message":{...}}
    #   {"type":"result","subtype":"success","stop_reason":"end_turn","is_error":false,...}
    #
    # --verbose is REQUIRED alongside stream-json in print mode; without it the
    # stream is refused. The terminal event is `result`, not `turn.end`.
    events_stdout: --output-format stream-json --verbose
    # The verdict the exit code does not carry. `is_error` was false on the
    # measured success; its FAILING spelling has not been observed, so only the
    # success value is declared and anything else reads as unverified.
    events_outcome:
      path: is_error
      ok: ["false"]
    events_done:
      field: type
      values: [result]
    exec: claude --dangerously-skip-permissions --model {model} -p {prompt}
    unsafe: {canonical: --dangerously-skip-permissions}
    steer_exec: claude --dangerously-skip-permissions --model {model}
    # Context-inheriting fork (`delegate self`): --fork-session branches a NEW session
    # from the current one, inheriting the full transcript; -p runs it headless and it
    # exits (safe to background — the parent session keeps running). No {model}: a fork
    # inherits the session's model. Requires the session id (CLAUDE_CODE_SESSION_ID).
    # {model} is optional: with none, the fork inherits the session's model (the
    # `--model {model}` pair drops out); `delegate self --model opus` transplants the
    # inherited context onto a different model (best-effort — claude may honor or
    # reject a model change on a resumed session).
    fork_exec: claude --resume {session} --fork-session --dangerously-skip-permissions --model {model} -p {prompt}
    # ACP rung (Sprint 418 S10): claude speaks stream-json, not ACP, so the ACP
    # agent process is the registry's bridge, claude-agent-acp — the release
    # the ACP registry's `claude-acp` entry distributes. Pinned 2026-10-11:
    # tarball downloaded, sha256 computed, and its sha512 re-hashed to the
    # npm-published integrity below (match). The bridge's own code is
    # Apache-2.0, but it runs @anthropic-ai/claude-agent-sdk under Anthropic's
    # Commercial Terms, so the registry (and this pin) say proprietary.
    # Installed by the operator (`npm i -g PACKAGE@VERSION`); bashy checks the
    # installed package.json version against the pin and node on PATH before
    # it drives it, and falls to the stream-json rung otherwise. Gated by
    # BASHY_ACP=1 like every ACP launch.
    acp_exec: claude-agent-acp
    acp_adapter:
      id: claude-acp
      name: Claude Agent
      description: ACP wrapper for Anthropic's Claude
      repository: https://github.com/agentclientprotocol/claude-agent-acp
      authors: [Anthropic, Zed Industries, JetBrains]
      source: npm
      package: "@agentclientprotocol/claude-agent-acp"
      version: 0.89.1
      license: proprietary
      license_url: https://github.com/agentclientprotocol/claude-agent-acp/blob/main/LICENSE
      bin: claude-agent-acp
      requires: [node]
      tarball:
        url: https://registry.npmjs.org/@agentclientprotocol/claude-agent-acp/-/claude-agent-acp-0.89.1.tgz
        sha256: 0df9fa22a5e1ccc39bfba37c0c58f272febed6884fb51a2df970840796ea2acb
        integrity: sha512-t1k8YPDvo/zUghL3x2pFs40tWfYTLhYmK8jt37CVBpY7eq1Ztj2hLZBAmy9ZX++tUyJaGfuuMrzvJGvU9tjBsg==
    session_env:
      - CLAUDE_CODE_SESSION_ID
      - CLAUDE_SESSION_ID
    prompt_position: last
    trust_preseed: .claude.json
    trust_clear: "say:1"
    supports_say: true
    supports_graceful_quit: true
    notes: TUI is steerable; a per-directory trust prompt needs a `say` of "1" (or a pre-seeded .claude.json).
    watchdog:
      max_runtime: 45m
      mem_limit: 12g
quirks: strongest deep / multi-file work; watch for API-timeout stalls on the hardest issue
harness:
  operability: 0.95
  shell: 0.95
  tool-use: 0.9
  isolation: 0.8
# Tool commands (Sprint #324): claude's own vendor features as bashy services,
# `bashy tool cmd run claude:<name> -- TEXT`. Only commands MEASURED on the
# wire are seeded here; unmeasured ones (deep-research, exit, review, …) are
# a user overlay — docs/tool-commands-overlay-example.yaml in the umbrella.
commands:
  # MEASURED 2026-11-12 (claude 2.1.284, Sprint #626 S1): plan is a print
  # PERMISSION MODE, not a slash line — /plan in print answers "isn't available
  # in this environment" (measured 2026-09-28) — hence exec:. `claude -p
  # --permission-mode plan --output-format json` on a toy git repo (add a
  # --shout flag to a 3-line hello.sh) returned subtype success, is_error
  # false, a five-step plan in 12.4 s, no permission denials and an unchanged
  # work tree. The exec carries its own --output-format: an exec override
  # does not get events_stdout. {args} is the request as ONE operand
  # (`bashy plan "TEXT"`); unquoted words become extra positionals.
  # slash: is the TUI spelling and the command's identity; it is not sent.
  # One plan per tool: the measured /plan TUI spelling (2026-09-28, 39.7 s,
  # steps esc) is in the umbrella's docs/tool-commands-overlay-example.yaml.
  - name: plan
    slash: /plan {args}
    mode: print
    capability: planning
    output: turn
    exec: claude -p --permission-mode plan --output-format json --model {model} {args}
  # MEASURED 2026-11-12 (claude 2.1.284, Sprint #626 S5): Gmail and Drive are
  # the account's claude.ai connectors (mcp__claude_ai_Gmail__*,
  # mcp__claude_ai_Google_Drive__*), reached in print through ToolSearch.
  # These commands are READ-ONLY by construction: --permission-mode dontAsk
  # denies every tool not in --allowedTools (the connector's read tools), and
  # --disallowedTools removes the send/draft (Gmail) or share/create/update
  # (Drive) tools, the other connectors and Bash/Edit/Write from the session
  # (a ToolSearch for send_message or share_file found nothing). `--tools`
  # must NOT be used: any --tools list also hides every MCP connector tool.
  # Names are the dotted roles, never the bare service: the selector matches
  # a role's head (email.send -> email), so a command named `email` would be
  # chosen for email.send. Sending or sharing stays a separate command that
  # declares the send effect. A claude parent session exports
  # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC, which keeps claude.ai
  # connectors from loading; the child then answers "no Gmail tool" with
  # subtype success. Run from a plain shell, or unset it.
  # email.read: "search Gmail for newer_than:7d (max 5), count only" ran
  # ToolSearch then search_threads (ids-only view), 5 threads, 10.8 s,
  # no permission denials.
  - name: email.read
    slash: /email.read {args}
    mode: print
    capability: email
    output: turn
    effects: [read, net, remote]
    exec: claude -p --permission-mode dontAsk --allowedTools mcp__claude_ai_Gmail__search_threads,mcp__claude_ai_Gmail__get_thread,mcp__claude_ai_Gmail__get_message,mcp__claude_ai_Gmail__list_labels,mcp__claude_ai_Gmail__list_drafts,mcp__claude_ai_Gmail__get_draft --disallowedTools Bash,Edit,Write,NotebookEdit,mcp__claude_ai_Gmail__send_message,mcp__claude_ai_Gmail__reply,mcp__claude_ai_Gmail__forward,mcp__claude_ai_Gmail__create_draft,mcp__claude_ai_Gmail__update_draft,mcp__claude_ai_Gmail__delete_draft,mcp__claude_ai_Google_Drive,mcp__claude_ai_Google_Calendar,mcp__claude_ai_Claude_Docs --output-format json --model {model} {args}
  # drive.read: "list my 5 most recently modified Drive files, count only"
  # ran ToolSearch then list_recent_files, 5 files, 6.9 s, no permission
  # denials.
  - name: drive.read
    slash: /drive.read {args}
    mode: print
    capability: drive
    output: turn
    effects: [read, net, remote]
    exec: claude -p --permission-mode dontAsk --allowedTools mcp__claude_ai_Google_Drive__search_files,mcp__claude_ai_Google_Drive__list_recent_files,mcp__claude_ai_Google_Drive__read_file_content,mcp__claude_ai_Google_Drive__download_file_content,mcp__claude_ai_Google_Drive__get_file_metadata,mcp__claude_ai_Google_Drive__get_file_permissions,mcp__claude_ai_Google_Drive__list_shared_drives,mcp__claude_ai_Google_Drive__get_shared_drive_metadata,mcp__claude_ai_Google_Drive__list_file_revisions --disallowedTools Bash,Edit,Write,NotebookEdit,mcp__claude_ai_Google_Drive__share_file,mcp__claude_ai_Google_Drive__create_file,mcp__claude_ai_Google_Drive__update_file,mcp__claude_ai_Google_Drive__copy_file,mcp__claude_ai_Google_Drive__trash_file,mcp__claude_ai_Gmail,mcp__claude_ai_Google_Calendar,mcp__claude_ai_Claude_Docs --output-format json --model {model} {args}
# Where this tool reads skills, instructions and MCP servers (dhnt research
# agentic-cli-integration-surfaces-2026-10): bashy skill export --tool reads it.
integration:
  detect: ${CLAUDE_CONFIG_DIR:-~/.claude}
  skills:
    user: ["${CLAUDE_CONFIG_DIR:-~/.claude}/skills"]
    project: [.claude/skills]
  instructions:
    - {file: "${CLAUDE_CONFIG_DIR:-~/.claude}/CLAUDE.md"}
    - {file: CLAUDE.md, scope: project}
  mcp:
    config: ~/.claude.json
    format: json
    key: mcpServers
    cli: [claude, mcp, add, --scope, user, bashy, --, bashy, mcp, serve]
  shell_env: CLAUDE_CODE_SHELL

# Claude stream-json rate-limit events. Allowed without high utilization is not a warning.
usage_signals:
  - id: stream-five_hour-rejected
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"rejected".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"five_hour"'
    kind: exhausted
    window: 5h
    reset: reset
    reset_layout: epoch
  - id: stream-five_hour-allowed_warning
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed_warning".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"five_hour"'
    kind: warning
    window: 5h
    reset: reset
    reset_layout: epoch
  - id: stream-five_hour-allowed
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"five_hour".*?"utilization":(?:0\.[89]\d*|1(?:\.0*)?)(?:[,}])'
    kind: warning
    window: 5h
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day-rejected
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"rejected".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day"'
    kind: exhausted
    window: week
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day-allowed_warning
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed_warning".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day"'
    kind: warning
    window: week
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day-allowed
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day".*?"utilization":(?:0\.[89]\d*|1(?:\.0*)?)(?:[,}])'
    kind: warning
    window: week
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day_opus-rejected
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"rejected".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day_opus"'
    kind: exhausted
    window: week
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day_opus-allowed_warning
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed_warning".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day_opus"'
    kind: warning
    window: week
    reset: reset
    reset_layout: epoch
  - id: stream-seven_day_opus-allowed
    match: '^\s*\{"type":"rate_limit_event","rate_limit_info":\{"status":"allowed".*?"resetsAt":(?P<reset>\d{9,12}).*?"rateLimitType":"seven_day_opus".*?"utilization":(?:0\.[89]\d*|1(?:\.0*)?)(?:[,}])'
    kind: warning
    window: week
    reset: reset
    reset_layout: epoch
