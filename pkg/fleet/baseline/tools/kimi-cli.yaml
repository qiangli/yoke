name: kimi-cli
kind: cli
display: Kimi Code
aliases: [kimi-code]
cli:
  binary: kimi
  # MANAGED INSTALL (D12, 2026-10-09): Moonshot's own Kimi Code CLI release
  # (MoonshotAI/kimi-code, native single binary `kimi`), pinned and verified
  # against the vendor's per-asset .sha256 sidecars (darwin/arm64 was
  # downloaded and re-hashed on a trusted dev host on 2026-10-09 and matched).
  # The release tag is "@moonshot-ai/kimi-code@<version>", URL-escaped below.
  # Not the PyPI kimi-cli (a different, Python package).
  managed:
    source: github-release
    version: 2.1.1
    license: MIT
    license_url: https://github.com/MoonshotAI/kimi-code/blob/main/LICENSE
    # NO THIRD-PARTY TRACKING (Sprint #434 rule 2, docs/bashy-supply-chain-audit.md).
    # KIMI_DISABLE_TELEMETRY is the vendor's own kill switch, read from the
    # source at the PINNED tag (@moonshot-ai/kimi-code@2.1.1,
    # packages/telemetry/src/bootstrap.ts):
    #
    #   export const TELEMETRY_DISABLE_ENV = 'KIMI_DISABLE_TELEMETRY';
    #   const TRUE_ENV_VALUES = new Set(['1','true','t','yes','y']);
    #   shouldEnableTelemetry() => enabled !== false && !isTelemetryDisabledByEnv()
    #
    # Set it and initializeTelemetry() tears the client down before a cloud
    # appender exists, so nothing reaches the intake. The HEADLESS path we
    # launch honours it: apps/kimi-code/src/cli/v2/run-v2-print.ts imports
    # shouldEnableTelemetry, and the TUI gates on isTelemetryDisabledByEnv too.
    # The config.toml key `telemetry: false` is the same switch by another
    # door (packages/node-sdk/src/sdk-rpc-client-v2.ts) — not used here,
    # because the operator owns that file.
    # kimi ships no Sentry/crash reporter (the only "sentry" in the tree is a
    # word in a slug list) and honours no DO_NOT_TRACK, so there is nothing
    # else to switch off: the binary is a Node SEA, not a Bun build.
    env:
      - KIMI_CODE_NO_AUTO_UPDATE=1
      - KIMI_DISABLE_TELEMETRY=1
    assets:
      darwin/arm64:
        url: https://github.com/MoonshotAI/kimi-code/releases/download/%40moonshot-ai%2Fkimi-code%40{version}/kimi-code-darwin-arm64.tar.gz
        sha256: 8c3bad99571b16abd113ab5d511a98a36b852c0d5493991842a67b8c2bc4ecd0
        member: kimi
      darwin/amd64:
        url: https://github.com/MoonshotAI/kimi-code/releases/download/%40moonshot-ai%2Fkimi-code%40{version}/kimi-code-darwin-x64.tar.gz
        sha256: f6dc0289112c24119d070f9203d44bcd53580e380819db25b58be65643b75bd4
        member: kimi
      linux/amd64:
        url: https://github.com/MoonshotAI/kimi-code/releases/download/%40moonshot-ai%2Fkimi-code%40{version}/kimi-code-linux-x64.tar.gz
        sha256: b66cc3787bc9dfa6a06761305dc8878f98e7a24f79fa4494c00714229a1486e8
        member: kimi
      linux/arm64:
        url: https://github.com/MoonshotAI/kimi-code/releases/download/%40moonshot-ai%2Fkimi-code%40{version}/kimi-code-linux-arm64.tar.gz
        sha256: 5c68d74b139b47fb3457f3805a159cdfa942a6a98a159ab158a1baf93b024bbd
        member: kimi
      windows/amd64:
        url: https://github.com/MoonshotAI/kimi-code/releases/download/%40moonshot-ai%2Fkimi-code%40{version}/kimi-code-win32-x64.tar.gz
        sha256: 87756a53a9bb0915842d884eaf43f69a06b2e404bcbb05d41c519c12d4b410cb
        member: kimi
  launch:
    exec: kimi -m {model} -p {prompt} --auto
    acp_exec: kimi acp
    prompt_position: last
    supports_say: true
    supports_graceful_quit: true
    notes: >-
      Moonshot Kimi Code (github.com/MoonshotAI/kimi-code) — a Claude-Code-family
      agentic CLI (interactive TUI is `kimi`). Note that `-m` takes a config.toml ALIAS,
      not a provider/model string.
    watchdog:
      max_runtime: 45m
      mem_limit: 12g
quirks: Moonshot agentic CLI
harness:
  operability: 0.8
  shell: 0.8
  tool-use: 0.8
  isolation: 0.7
# Where this tool reads skills, instructions and MCP servers (dhnt research
# agentic-cli-integration-surfaces-2026-10): bashy skill export --tool reads it.
integration:
  detect: ~/.kimi
  skills:
    user: [~/.kimi/skills, ~/.agents/skills]
    project: [.agents/skills]
  instructions:
    - {file: AGENTS.md, scope: project}
  mcp: {config: ~/.kimi/mcp.json, format: json, key: mcpServers}
