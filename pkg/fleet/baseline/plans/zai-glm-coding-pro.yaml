name: zai-glm-coding-pro
label: glm
display: GLM Coding Plan Pro (z.ai)
vendor: Z.ai
vendor_plan: GLM Coding Plan Pro
# Z.ai's ladder is Lite < Pro < Max, so Pro's normalized tier is pro. Flat billing
# over an API key (api_key_ref zai) on the coding-plan endpoint — see
# models/glm-5.2.yaml for why that split Kind from Billing.
tier: pro
as_of: "2026-09-29"
sources:
  - https://docs.z.ai/devpack/overview
notes: >-
  The plan is metered in CREDITS (dual 5-hour and weekly budgets), not tokens or
  prompts; the token allowance a credit buys varies with model, cache hit rate and
  peak hours, so no token limit is derived from it. The earlier published quota
  (~400 prompts per 5h, recorded 2026-07-14 in models/glm-5.2.yaml) predates the
  credit scheme and is not carried forward.
limits:
  - window: 5h
    unit: credits
    value: 12000
    evidence: published
    as_of: "2026-09-29"
    source: https://docs.z.ai/devpack/overview
  - window: week
    unit: credits
    value: 60000
    evidence: published
    as_of: "2026-09-29"
    source: https://docs.z.ai/devpack/overview
  # MEASURED 2026-07-14 on this host after the Lite->Pro upgrade: 8 parallel
  # requests -> 8 OK; 12 -> 7 OK, 5x429 (code 1302). z.ai publishes no concurrency
  # for any tier; this is a bashy observation on glm-5.2 only.
  - window: concurrent
    unit: requests
    value: 8
    model: glm-5.2
    evidence: measured
    as_of: "2026-07-14"
    source: pkg/fleet/baseline/models/glm-5.2.yaml
# No usage probe — checked 2026-10-17: docs.z.ai (llms.txt + full API
# reference) lists only chat/image/video/generation endpoints; no documented
# usage or credits endpoint exists, and the coding-plan key (api_key_ref zai)
# is not a subscription OAuth login. The home dir holds no local usage file;
# without a documented read-only endpoint a probe would need to invent a URL.
# The seat therefore stays unmeasured; bashy quota reports unmeasured (never
# 0% or a fabricated percentage) and surfaces live quota only via the 429
# signals below. The only vendor-documented quota facts are the credit limits
# above (published) and the concurrent ceiling (measured).
# Usage signals (Sprint #447). Message shapes are the vendor's error table
# (https://docs.z.ai/api-reference/api-code, checked 2026-10-15); the 1308
# body is MEASURED on this host (2026-10-12, HTTP 429):
#   {"error":{"code":"1308","message":"Usage limit reached for 5 hour.
#    Your limit will reset at 2026-10-12 17:34:44"}}
# The matcher runs on the message text, so it fires on the raw body and on
# JSON-wrapped excerpts alike. 1302 is a rate/concurrency cap that clears in
# seconds: no reset to parse. Weekly/monthly (1310+) is a different wording
# and is deliberately not guessed here.
usage_signals:
  - id: "1302"
    match: '(?i)(?:"code"\s*:\s*"1302")|\brate limit reached for requests\b'
    kind: rate-limited
  - id: "1308"
    match: '(?i)usage limit reached for \d+ hours?\.?\s+your limit will reset at (?P<reset>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})'
    kind: exhausted
    window: 5h
    reset: reset
    reset_layout: "2006-01-02 15:04:05"
