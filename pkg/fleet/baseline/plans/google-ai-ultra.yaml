name: google-ai-ultra
label: agy
display: Google AI Ultra
vendor: Google
vendor_plan: Google AI Ultra
# Google's ladder is Free < AI Plus < AI Pro < AI Ultra. Ultra is the vendor's
# highest individual plan, so its normalized tier is max. It is the seat agy
# (Antigravity) bills every model it serves against — including the Claude and
# GPT-OSS models reached through agy. Seat upgraded from AI Pro to AI Ultra on
# 2026-10-20.
tier: max
as_of: "2026-10-20"
sources:
  - https://gemini.google/subscriptions/
notes: >-
  Antigravity on Ultra is described only as the highest rate limits (Pro:
  "Entry rate limits"). No numeric threshold is published, so none is recorded.
# No usage probe — checked 2026-10-17: agy (Antigravity/Gemini CLI) exposes no
# documented local usage file and no CLI status/usage command. `agy --help`
# lists only agent/agents/models/mcp/plugin/remote-control/update; the home
# dir ~/.gemini/antigravity-cli holds sqlite conversations and settings.json
# with no quota fields, and agy's OAuth credential (oauth_creds.json) is not a
# usage source. The vendor publishes no quota endpoint for the subscription
# seat; the only documented quota signals are the 429 bodies already covered
# below. The seat therefore stays unmeasured; bashy quota reports unmeasured
# (never 0% or a fabricated percentage).
# Usage signals (Sprint #447): Google-style 429 bodies. RESOURCE_EXHAUSTED
# carries a retryDelay ("37s", a Go duration) in its quota details block;
# "Quota exceeded for quota metric ..." is the message wording. Both wordings
# are the standard Google API error shape (cloud.google.com/docs/usage,
# checked 2026-10-15).
usage_signals:
  - id: resource-exhausted
    match: '(?is)resource_exhausted.{0,800}?"retryDelay"\s*:\s*"(?P<reset>[^"]+)"'
    kind: exhausted
    reset: reset
    reset_layout: relative
  - id: quota-metric
    match: '(?i)quota exceeded for quota metric'
    kind: exhausted
