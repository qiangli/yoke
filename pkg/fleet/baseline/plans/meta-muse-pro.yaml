name: meta-muse-pro
label: muse
display: Meta Muse (Pro seat)
vendor: Meta
# The operator's seat is recorded as Pro — a paid plan below Meta's top one. On
# 2026-09-29 Meta's help page listed the Muse plans as Power ($20/mo, 500M Muse
# tokens/week) and Maximum ($100/mo, 3B/week), with NO plan named Pro, and Muse
# Code sells separate Everyday/High/Power usage plans. Which of those products and
# plans meters the muse CLI's seat is NOT established, so vendor_plan is left unset
# and no limit is recorded: a number read off the wrong plan is a guess.
tier: pro
as_of: "2026-09-29"
sources:
  - https://www.meta.com/help/subscriptions/1021145227643680/
notes: >-
  Tier is operator-reported (story 5fec08b11a5f). Set vendor_plan and add the
  matching weekly token limit once the seat's vendor plan is confirmed.
# No usage probe — checked 2026-10-17: the muse CLI (`muse --help`) exposes
# no usage/limits/status subcommand (only resume/exec/export/trace/model-
# profile/skills/voice/plugins/sandbox/schema/serve/session-message/mcp/auth/
# login/logout/init), and no documented local usage file exists under
# ~/.local/share/muse (sessions store transcripts, not quota). The vendor
# publishes no documented usage endpoint reachable with the fleet's credential
# (the CLI authenticates via keychain, not a documented API key quota
# endpoint). The seat therefore stays unmeasured; bashy quota reports
# unmeasured (never 0% or a fabricated percentage).
