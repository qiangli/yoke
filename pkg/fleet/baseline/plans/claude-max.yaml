name: claude-max
label: claude
display: Claude Max 20x
vendor: Anthropic
vendor_plan: Max 20x
# Max 20x is Anthropic's highest INDIVIDUAL plan (Free < Pro < Max 5x < Max 20x),
# checked on the vendor's pricing page 2026-09-29.
tier: max
as_of: "2026-09-29"
sources:
  - https://claude.com/pricing
notes: >-
  The page states usage resets on a rolling five-hour session window with weekly
  limits on top for paid plans, and that "there's no fixed message count" — Max 20x
  is described only as 20x Pro's usage per session. No numeric limit is published,
  so none is recorded: the budget gate stays fail-open for this seat.
# Usage probe (added 2026-10-15): the statusline bridge snapshot the harness
# installs at $HOME/.bashy/quota/claude.json (schema bashy-claude-statusline-v1).
# Field names are the ones llmbudget's claude-statusline adapter already reads:
# payload.rate_limits.five_hour/.seven_day, each used_percentage (number) and
# resets_at (epoch seconds). Reading the snapshot is read-only; a missing file
# (bridge not installed) reports not-configured with a one-line reason.
usage:
  - id: statusline
    run:
      body: |
        if [ ! -f "$HOME/.bashy/quota/claude.json" ]; then
          echo "no snapshot at $HOME/.bashy/quota/claude.json" >&2
          exit 1
        fi
        cat "$HOME/.bashy/quota/claude.json"
      effects: [read]
    metrics:
      - name: used_percent
        value: .payload.rate_limits.five_hour.used_percentage
        unit: percent
        window: 5h
        reset: .payload.rate_limits.five_hour.resets_at
      - name: used_percent
        value: .payload.rate_limits.seven_day.used_percentage
        unit: percent
        window: week
        reset: .payload.rate_limits.seven_day.resets_at
# Usage signals (Sprint #447): the vendor's own quota words and the unified
# reset header. Wording per the story brief; the statusline JSON already
# measured on this host (rate_limits.five_hour/.seven_day with resets_at
# epoch seconds) is the same fact through the probe above — these matchers
# cover the error-path spellings the probe never sees.
usage_signals:
  - id: usage-limit-reset
    match: '(?i)claude usage limit reached\..*?your limit will reset at (?P<reset>[^.\n]+)'
    kind: exhausted
    window: 5h
    reset: reset
    reset_layout: clock
  - id: five-hour-limit
    match: '(?i)5-hour limit reached'
    kind: exhausted
    window: 5h
  - id: weekly-percent
    match: '(?i)you''ve used (?P<used>\d+(?:\.\d+)?)% of your weekly limit'
    kind: warning
    window: week
    used_percent: used
  - id: unified-reset
    header: anthropic-ratelimit-unified-reset
    match: '^\s*(?P<reset>\d{9,12})\s*$'
    kind: exhausted
    reset: reset
    reset_layout: epoch
