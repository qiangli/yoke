name: deepseek-v4-flash
family: deepseek-flash
version: "4"
band: 2
band_source: declared
band_season: 1
display: DeepSeek V4 Flash
provider: openai-compat
kind: api
base_url: https://api.deepseek.com
api_key_ref: deepseek
# The wire id is `deepseek-flash`, not `deepseek-v4-flash`: on 2026-09-13
# GET https://api.deepseek.com/models listed exactly two ids, deepseek-v4-pro
# and deepseek-flash. The bashy NAME keeps its version (a name is a record
# key; the nickname is drawn from the binding), only the id the provider
# answers to changed. The old id was not exercised live before the switch —
# a listed id is the safe choice either way.
model: deepseek/deepseek-flash
# CONTEXT: the vendor's model table, https://api-docs.deepseek.com/quick_start/pricing
# (read 2026-10-09), lists deepseek-flash (which this id now serves) with CONTEXT LENGTH "1M" and OUTPUT LENGTH
# MAXIMUM "384K" (the schema has no max-output field; genie reserves its own).
# "1M" is recorded as 1,000,000 — the vendor does not spell the exact figure,
# and the decimal reading is the conservative budget. Without this line genie
# ran the model under a 32768-token fallback (20480 usable).
context_length: 1000000
quality: 0.76
cost_micro: 600
# ycode detects the provider from the model name, so it takes the BARE id —
# litellm's `provider/model` prefix is rejected. The id a model answers to is a
# property of the TOOL, not of the model.
ids:
  ycode: deepseek-flash
