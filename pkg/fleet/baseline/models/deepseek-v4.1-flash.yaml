name: deepseek-v4.1-flash
retired:
  at: 2026-10-09
  reason: not in the 1.0 curated list
  replaced_by: deepseek-v4-pro
family: deepseek-flash
version: "4.1"
band: 2
band_source: declared
band_season: 1
# A PRIOR, not a measurement. DeepSeek released V4.1 Flash on 2026-09-10 (API
# changelog) and retired V4 Flash: `deepseek-flash` now serves V4.1, and the
# old `deepseek-v4-flash` id is only temporarily routed to it. It inherits
# deepseek-v4-flash's L2 peg. The `deepseek-flash` family alias re-points here.
display: DeepSeek V4.1 Flash
provider: openai-compat
kind: api
base_url: https://api.deepseek.com
api_key_ref: deepseek
model: deepseek/deepseek-flash
# CONTEXT: the vendor's model table, https://api-docs.deepseek.com/quick_start/pricing
# (read 2026-10-09), lists deepseek-flash with CONTEXT LENGTH "1M" and OUTPUT LENGTH
# MAXIMUM "384K" (the schema has no max-output field; genie reserves its own).
# "1M" is recorded as 1,000,000 — the vendor does not spell the exact figure,
# and the decimal reading is the conservative budget. Without this line genie
# ran the model under a 32768-token fallback (20480 usable).
context_length: 1000000
quality: 0.77
# DeepSeek cut the price with V4.1; carried over from v4 as an upper bound.
cost_micro: 600
# ycode takes the BARE id (see deepseek-v4-flash.yaml).
ids:
  ycode: deepseek-flash
