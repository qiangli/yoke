# The id comes from `agy models`, which is agy's OWN published list and the only
# authoritative source for this field. Verified accepted on the wire 2026-08-02:
#
#   $ agy --model gemini-3.6-flash-low -p "reply with exactly: OK"  -> OK (exit 0)
#
# Note for anyone reading the 3.1/3.5 entries: their comment says agy "takes
# DISPLAY strings, not slugs". That is no longer true — both forms are accepted
# today (the display string was verified on the wire in the same session). What
# the original comment actually caught was a WRONG id (`gemini-3.1`), not a
# wrong FORMAT. Prefer the published slug: it is what agy lists, so it cannot
# drift from what agy accepts.
