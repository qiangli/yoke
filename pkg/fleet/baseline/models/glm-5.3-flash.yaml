name: glm-5.3-flash
# Its own family: `glm` ranks the full-size line (5.2 → 5.3) and a flash
# variant must not capture the `glm` alias.
family: glm-flash
version: "5.3"
band: 2
band_source: declared
# declared: a flash-class sibling of glm-5.3 (L3 measured). Flash tiers trade
# depth for latency; it is seeded one rung under its parent, next to glm-5.2,
# until a gate on this host says otherwise. Seeded 2026-09-13.
display: GLM-5.3 Flash (z.ai)
provider: openai-compat
kind: api          # AUTH: an API key (same zai key as 5.3)
billing: flat      # PAY: the same prepaid GLM Coding Plan seat. Free at the margin.
base_url: https://api.z.ai/api/coding/paas/v4
api_key_ref: zai
# Listed by GET /models on the coding-plan endpoint on 2026-09-13 (with glm-5.3,
# 5.2, 5.1, 5, 5-turbo, 4.x). Not yet exercised with a completion from this
# host. Same trap as glm-5.3: it is likely to SPEND REASONING TOKENS, so a tight
# max_tokens yields a 200 with empty content — treat that as a failure.
model: glm-5.3-flash
quality: 0.80
cost_micro: 500
ids:
  ycode: glm-5.3-flash
