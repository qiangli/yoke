name: door-claude-opus5
display: claude-opus5 via the model door (sticky genie-opus5)
# The cligw model door: bashy's loopback openai-compat front of a CLI harness,
# stable at 127.0.0.1:24556. The sticky path pins one CLI session per genie
# agent; the bashy-llm owner token authenticates to the door. No family: a
# door proxies a family member and must not capture its floating alias.
# band: declared from the served model (models/opus5.yaml) — the door changes the harness in
# front of the model, not the model; no gate has run through the door yet.
