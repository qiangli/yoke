<!doctype html>
<html lang="en" data-bashy-console="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Accounts — bashy</title>
<link rel="stylesheet" href="app.css">
<style>
#acc-page {
  max-width: 1200px;
  margin: 1.5rem auto;
  padding: 0 1.5rem 3rem 1.5rem;
}
.acc-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  align-items: center;
  margin-bottom: 1.5rem;
  padding: 0.85rem 1rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.acc-toolbar label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  color: var(--muted-foreground);
}
.acc-toolbar input[type="search"],
.acc-toolbar select {
  padding: 0.45rem 0.75rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--background);
  color: var(--foreground);
  font: inherit;
  font-size: 0.85rem;
}
.acc-toolbar input[type="search"] {
  min-width: 220px;
}
.acc-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  padding: 0.45rem 0.9rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--foreground);
  font: inherit;
  font-size: 0.85rem;
  cursor: pointer;
  transition: opacity 0.1s ease;
}
.acc-btn:hover {
  background: var(--muted);
}
.acc-btn.primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.acc-btn.primary:hover {
  opacity: 0.9;
}
.acc-alert {
  padding: 1rem 1.25rem;
  margin-bottom: 1.5rem;
  border-radius: 8px;
  background: #fef2f2;
  border: 1px solid #f87171;
  color: #991b1b;
  font-size: 0.9rem;
}
:root[data-theme="dark"] .acc-alert {
  background: #450a0a;
  border-color: #991b1b;
  color: #fca5a5;
}
.acc-notice {
  padding: 0.75rem 1rem;
  margin-bottom: 1rem;
  border-radius: 8px;
  background: #fffbeb;
  border: 1px solid #fde68a;
  color: #92400e;
  font-size: 0.85rem;
}
:root[data-theme="dark"] .acc-notice {
  background: #451a03;
  border-color: #92400e;
  color: #fde68a;
}
.acc-empty-box {
  text-align: center;
  padding: 3rem 1.5rem;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--muted-foreground);
}
.acc-loading-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 3rem;
  color: var(--muted-foreground);
}
.acc-spinner {
  width: 1.25rem;
  height: 1.25rem;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: acc-spin 0.8s linear infinite;
}
@keyframes acc-spin {
  to { transform: rotate(360deg); }
}
.acc-table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.acc-table th {
  text-align: left;
  padding: 0.75rem 1rem;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted-foreground);
  border-bottom: 1px solid var(--border);
  background: var(--muted);
}
.acc-table td {
  padding: 0.85rem 1rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  font-size: 0.9rem;
}
.acc-row {
  cursor: pointer;
  transition: background 0.1s ease;
}
.acc-row:hover {
  background: color-mix(in srgb, var(--card) 92%, var(--primary));
}
.acc-avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--muted);
  color: var(--foreground);
  font-weight: 600;
  font-size: 0.8rem;
  overflow: hidden;
  border: 1px solid var(--border);
  text-align: center;
}
.acc-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.acc-badge {
  display: inline-block;
  padding: 0.15rem 0.5rem;
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
}
.acc-status-resolved { background: #dcfce7; color: #166534; }
.acc-status-unresolved { background: #fef3c7; color: #92400e; }
.acc-status-error { background: #fee2e2; color: #991b1b; }
.acc-status-suppressed { background: #f4f4f5; color: #71717a; }
:root[data-theme="dark"] .acc-status-resolved { background: #14532d; color: #86efac; }
:root[data-theme="dark"] .acc-status-unresolved { background: #78350f; color: #fde68a; }
:root[data-theme="dark"] .acc-status-error { background: #7f1d1d; color: #fca5a5; }
:root[data-theme="dark"] .acc-status-suppressed { background: #27272a; color: #a1a1aa; }

.acc-detail-pane {
  background: var(--muted);
  padding: 1.25rem;
  border-bottom: 1px solid var(--border);
}
.acc-detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1.25rem;
  margin-bottom: 1rem;
}
.acc-detail-card {
  background: var(--card);
  padding: 1rem;
  border-radius: 8px;
  border: 1px solid var(--border);
}
.acc-detail-card h4 {
  margin: 0 0 0.5rem 0;
  font-size: 0.8rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--muted-foreground);
}
.acc-cli-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  background: var(--background);
  padding: 0.4rem 0.6rem;
  border-radius: 4px;
  border: 1px solid var(--border);
  font-family: ui-monospace, monospace;
  font-size: 0.8rem;
  margin-top: 0.4rem;
}
.acc-cli-box code {
  user-select: all;
  white-space: nowrap;
}
.acc-copy-btn {
  font-size: 0.75rem;
  padding: 0.2rem 0.5rem;
}
.acc-metric-table, .acc-resource-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
  margin-top: 0.5rem;
}
.acc-metric-table th, .acc-resource-table th {
  text-align: left;
  padding: 0.4rem 0.5rem;
  border-bottom: 1px solid var(--border);
  color: var(--muted-foreground);
}
.acc-metric-table td, .acc-resource-table td {
  padding: 0.4rem 0.5rem;
  border-bottom: 1px solid var(--border);
}
.acc-period-tabs {
  display: flex;
  gap: 0.3rem;
  margin-bottom: 0.5rem;
}
.acc-period-btn {
  padding: 0.2rem 0.6rem;
  font-size: 0.75rem;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--foreground);
  cursor: pointer;
}
.acc-period-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.acc-safe-link {
  color: var(--primary);
  text-decoration: underline;
}
</style>
</head>
<body class="standalone">
<header id="bar">
  <a id="brand" href="accounts/" title="bashy accounts">
    <span id="wordmark">bashy<b>accounts</b></span>
  </a>
  <span class="spacer"></span>
  <span id="acc-who"></span>
</header>

<main id="acc-page" aria-busy="true">
  <div class="acc-toolbar">
    <input id="acc-search" type="search" placeholder="Filter by alias, provider, name, team..." autocomplete="off" aria-label="Search accounts">
    <label>Provider
      <select id="acc-filter-provider" aria-label="Filter by provider">
        <option value="">all</option>
      </select>
    </label>
    <label>Category
      <select id="acc-filter-category" aria-label="Filter by category">
        <option value="">all</option>
      </select>
    </label>
    <label>Team
      <select id="acc-filter-team" aria-label="Filter by team">
        <option value="">all</option>
      </select>
    </label>
    <label>Status
      <select id="acc-filter-status" aria-label="Filter by status">
        <option value="">all</option>
        <option value="resolved">resolved</option>
        <option value="unresolved">unresolved</option>
        <option value="error">error</option>
        <option value="suppressed">suppressed</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button id="acc-refresh-all" class="acc-btn primary" type="button">Refresh all</button>
  </div>

  <div id="acc-error" class="acc-alert" role="alert" style="display:none"></div>
  <div id="acc-stale" class="acc-notice" style="display:none"></div>

  <div id="acc-loading" class="acc-loading-box">
    <div class="acc-spinner"></div>
    <span>Loading accounts inventory...</span>
  </div>

  <div id="acc-empty" class="acc-empty-box" style="display:none">
    <p>No accounts match the current filter, or none configured yet.</p>
    <p class="sub">Discover local accounts with <code>bashy account discover</code> or add one with <code>bashy account add</code>.</p>
  </div>

  <table id="acc-table" class="acc-table" style="display:none">
    <thead>
      <tr>
        <th style="width:40px"></th>
        <th>Alias</th>
        <th>Provider / Category</th>
        <th>Team / Profile</th>
        <th>Status</th>
        <th>Quota / Reset</th>
        <th>Spend</th>
        <th>Freshness</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="acc-tbody"></tbody>
  </table>
</main>

<script src="accounts.js"></script>
</body>
</html>
