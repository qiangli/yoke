<!doctype html>
<html lang="en" data-bashy-console="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Shape — bashy</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="standalone">
<header id="bar">
  <a id="brand" href="./" title="bashy apps">
    <span id="wordmark">bashy<b>shape</b></span>
  </a>
  <span class="spacer"></span>
  <span id="shape-who" title="changes you make here are yours alone"></span>
</header>

<main id="shape-page">
  <form id="shape-ask" autocomplete="off">
    <label for="shape-request">What should change in <b id="shape-app"></b>?</label>
    <textarea id="shape-request" rows="3" placeholder="e.g. show the newest note first" aria-describedby="shape-result"></textarea>
    <div class="row foot">
      <span id="shape-active"></span>
      <span class="spacer"></span>
      <span id="shape-result" role="status" aria-live="polite"></span>
      <button id="shape-send" class="btn primary" type="submit" aria-label="Send shaping request">Shape</button>
    </div>
  </form>

  <section id="shape-list" aria-label="Shaping candidates" aria-live="polite"></section>

  <section id="shape-history" aria-label="Version history">
    <div class="row foot">
      <h2 id="history-heading">Versions</h2>
      <span class="spacer"></span>
      <button id="history-undo" class="btn" type="button" aria-label="Undo the last restore">Undo restore</button>
    </div>
    <div id="history-status" role="status" aria-live="polite"></div>
    <div id="history-diff-actions" class="row foot">
      <span class="spacer"></span>
      <button id="history-compare" class="btn" type="button" aria-label="Compare the two selected versions">Compare selected</button>
    </div>
    <ol id="history-list"></ol>
    <div id="history-diff-host" aria-label="Version comparison"></div>
  </section>
</main>

<script src="shape.js"></script>
</body>
</html>
