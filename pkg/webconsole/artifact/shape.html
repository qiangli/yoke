<!doctype html>
<html lang="en" data-bashy-console="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title>Shape — bashy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23FFFFFF'/><g transform='translate(32 32) scale(0.84) translate(-32 -32)'><circle cx='32' cy='32' r='27' fill='none' stroke='%231E1B2E' stroke-width='5'/><rect x='19' y='19' width='11' height='11' rx='1.5' fill='%231E1B2E'/><rect x='19' y='34' width='11' height='11' rx='1.5' fill='%231E1B2E'/><rect x='34' y='34' width='11' height='11' rx='1.5' fill='%231E1B2E'/><polygon points='39.5,17 47,24.5 39.5,32 32,24.5' fill='%236D4AFF'/></g></svg>">
<link rel="stylesheet" href="app.css">
</head>
<body class="standalone">
<header id="bar">
  <a id="brand" href="./" title="bashy apps">
    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--foreground)" stroke-width="5"/><rect x="19" y="19" width="11" height="11" rx="1.5" fill="var(--foreground)"/><rect x="19" y="34" width="11" height="11" rx="1.5" fill="var(--foreground)"/><rect x="34" y="34" width="11" height="11" rx="1.5" fill="var(--foreground)"/><polygon points="39.5,17 47,24.5 39.5,32 32,24.5" fill="var(--mark-accent)"/></svg>
    <span id="wordmark">bashy<b>shape</b></span>
  </a>
  <span class="spacer"></span>
  <span id="shape-who" title="changes you make here are yours alone"></span>
</header>

<main id="shape-page">
  <form id="shape-ask" autocomplete="off">
    <label for="shape-request">What should change in <b id="shape-app"></b>?</label>
    <textarea id="shape-request" rows="3" placeholder="e.g. show the newest note first" aria-describedby="shape-result"></textarea>
    <div class="row foot">
      <span id="shape-active"></span>
      <span class="spacer"></span>
      <span id="shape-result" role="status" aria-live="polite"></span>
      <button id="shape-send" class="btn primary" type="submit" aria-label="Send shaping request">Shape</button>
    </div>
  </form>

  <section id="shape-list" aria-label="Shaping candidates" aria-live="polite"></section>

  <section id="shape-history" aria-label="Version history">
    <div class="row foot">
      <h2 id="history-heading">Versions</h2>
      <span class="spacer"></span>
      <button id="history-undo" class="btn" type="button" aria-label="Undo the last restore">Undo restore</button>
    </div>
    <div id="history-status" role="status" aria-live="polite"></div>
    <ol id="history-list"></ol>
  </section>
</main>

<script src="shape.js"></script>
</body>
</html>
