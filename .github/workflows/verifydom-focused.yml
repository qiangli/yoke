name: focused Genie DOM verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genie-dom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=2"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgpgme-dev libbtrfs-dev libassuan-dev libdevmapper-dev libseccomp-dev
      - name: Repeat the two original browser interactions
        shell: bash
        run: |
          set -o pipefail
          git rev-parse HEAD | tee genie-dom-source.txt
          go test ./pkg/webconsole -tags verifydom -run '^TestDOMGenie(EditSession|ReviewBar)$' -count=10 -timeout=10m -v 2>&1 | tee genie-dom.log
          test "$(grep -Ec '^--- PASS: TestDOMGenie(EditSession|ReviewBar) ' genie-dom.log)" -eq 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-genie-dom
          path: |
            genie-dom-source.txt
            genie-dom.log
